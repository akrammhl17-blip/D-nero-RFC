<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dönero RFC – المنيو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--o:#ff6a1a;--y:#ffb400;--k:#0b0b0b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:60px}
body{background:var(--k);color:#fff;font-family:Cairo,Tahoma,sans-serif;display:flex;flex-direction:column;overflow-x:hidden;max-width:560px;margin:auto}
.side{order:99;align-self:center;display:flex;flex-direction:row;gap:14px;margin:0 0 calc(28px + env(safe-area-inset-bottom,0px));padding:10px 18px;background:#000;border-radius:34px;border:1px solid #ff6a1a88}main,header,footer,nav{min-width:0}
.side a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--o),var(--y));color:#111;transition:transform .2s}
.side a:active{transform:scale(.88)}.side svg{width:23px;height:23px;fill:currentColor}
.hero{position:relative;text-align:center;padding:34px 14px 26px;background:radial-gradient(circle at 50% 0,#3a1300,#0b0b0b 70%);overflow:hidden}
.hero img.lg{width:150px;height:150px;border-radius:50%;animation:glow 3s ease-in-out infinite;position:relative;z-index:1}
@keyframes glow{50%{box-shadow:0 0 45px #ff6a1a99}}
.hero h1{font-weight:900;font-size:34px;margin-top:10px;position:relative}.hero p{color:#ffd9b8;position:relative}
.st{display:inline-block;margin:12px 0 4px;padding:6px 18px;border-radius:20px;font-weight:700;font-size:17px;position:relative}
.st.on{background:#1f7a3a}.st.off{background:#8a2a1a}
.hr{font-size:15px;color:#ddd;position:relative}.dl{display:inline-block;margin-top:10px;padding:6px 16px;border:1px dashed var(--y);border-radius:12px;color:var(--y);font-weight:700;position:relative;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.shop{display:block;margin:18px auto 0;width:88%;border-radius:18px;border:2px solid #ff6a1a55;position:relative}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;gap:8px;overflow-x:auto;padding:9px 10px;background:#0b0b0bee;backdrop-filter:blur(8px);scrollbar-width:none}
nav a{flex:none;color:#fff;text-decoration:none;font-size:15px;font-weight:700;padding:7px 14px;border-radius:18px;background:#1d1d1d;transition:.25s}
nav a.on{background:linear-gradient(135deg,var(--o),var(--y));color:#111}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fx i{position:absolute;bottom:-12px;width:var(--s);height:var(--s);border-radius:50%;background:var(--p);box-shadow:0 0 9px var(--p);opacity:0;animation:rise var(--d) linear var(--l) infinite}
@keyframes rise{10%{opacity:.9}100%{transform:translate(var(--x),-75vh);opacity:0}}
@keyframes fall{10%{opacity:.9}100%{transform:translate(var(--x),75vh) rotate(300deg);opacity:0}}
.t-grill{--p:#ff5a1f;--bg:radial-gradient(ellipse at 50% 108%,#ff5a1fe6,#9a2000aa 24%,transparent 60%),repeating-linear-gradient(90deg,#ffffff0f 0 2px,transparent 2px 22px),linear-gradient(#1a0500,#2a0900 60%,#120200)}
.t-kfc{--p:#e8a24a;--bg:linear-gradient(#000000b8,#000000d0),repeating-linear-gradient(90deg,#d62a1c 0 38px,#f2e6d6 38px 76px)}.t-kfc .fx i{top:-12px;bottom:auto;border-radius:35%;animation-name:fall}
.t-sand{--p:#ff8a3c;--bg:radial-gradient(circle at 20% 12%,#ff8a3c66,transparent 45%),repeating-linear-gradient(135deg,#ffffff0b 0 14px,transparent 14px 28px),linear-gradient(#3d1a04,#140a02)}
.t-main{--p:#ffb347;--bg:radial-gradient(circle at 50% 40%,#ffb34755,transparent 55%),repeating-linear-gradient(0deg,#00000033 0 3px,transparent 3px 9px),linear-gradient(#3d2610,#1b0f05)}
.t-fries{--p:#ffd23f;--bg:linear-gradient(#000000aa,#000000cc),repeating-conic-gradient(#e63b1f 0 25%,#ffd23f 0 50%) 0 0/64px 64px}.t-fries .fx i{width:5px;height:22px;border-radius:2px;top:-24px;bottom:auto;animation-name:fall}
.t-hot{--p:#ff9a2f;--bg:radial-gradient(circle at 15% 90%,#ffb02ea6,transparent 42%),radial-gradient(circle at 90% 18%,#ff3d00a6,transparent 46%),linear-gradient(#3d0e02,#150300)}
.t-cold{--p:#6adf8a;--bg:radial-gradient(circle at 80% 10%,#6adf8a55,transparent 42%),radial-gradient(circle at 10% 80%,#2fa35a66,transparent 46%),radial-gradient(#ffffff14 1.5px,transparent 2px) 0 0/22px 22px,linear-gradient(#06301a,#031208)}.t-cold .fx i{border-radius:0 100% 0 100%;width:12px;height:12px;top:-14px;bottom:auto;animation-name:fall}
.t-knafeh{--p:#ffc94d;--bg:radial-gradient(circle at 50% 30%,#ffc94d66,transparent 58%),repeating-radial-gradient(circle at 50% 50%,#ffc94d1a 0 2px,transparent 2px 26px),linear-gradient(#412803,#150b01)}.t-knafeh .fx i:nth-child(3n){background:#fff;filter:blur(7px);width:34px;height:34px;box-shadow:none;opacity:0}
footer{padding:26px 16px 18px;text-align:center;background:#000;font-size:16px;color:#ccc;line-height:2}
footer a{color:var(--y);text-decoration:none;font-weight:700}
@media(min-width:820px){body{max-width:none}nav{justify-content:center;gap:12px}nav a{font-size:17px;padding:9px 20px}.hero{padding:56px 20px 44px}.hero img.lg{width:200px;height:200px}.hero h1{font-size:58px}.hero p{font-size:22px}.st{font-size:18px}.hr{font-size:17px}.shop{width:min(60%,620px)}.sc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"cat big" "ttl big" "ds big" "tabs big" "rw rw";grid-template-rows:auto auto auto auto 1fr;column-gap:4vw;align-items:center;padding:48px 7vw 36px;min-height:100vh}.cat{grid-area:cat;align-self:end;font-size:22px}.ttl{grid-area:ttl;text-align:start;font-size:62px;min-height:0;align-self:start}.ds{grid-area:ds;text-align:start;font-size:20px;max-width:520px;min-height:0;align-self:start}.tabs{grid-area:tabs;justify-content:flex-start;margin-top:14px;align-self:start}.tabs button{font-size:17px;padding:10px 20px}.big{grid-area:big;justify-self:center;width:min(32vw,440px);margin:0}.rw{grid-area:rw;width:100%;margin:30px 0 0;align-self:end}.row{justify-content:safe center;padding:70px 20px 16px}.cd{width:180px;padding:62px 10px 14px}.cd .im{width:104px;height:104px;margin-left:-52px;top:-50px}.cd b{font-size:17px}.cd .pc{font-size:20px}.roo{width:92px}.chip b{font-size:26px}.bi{font-size:200px}.side{margin-bottom:36px}}
@media(hover:hover){.cd:hover{transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.it{opacity:1;transform:none}}

.sc{position:relative;min-height:100svh;padding:14px 8px 18px;display:flex;flex-direction:column;align-items:center;background:var(--bg);overflow:hidden}
.sc>*{position:relative;z-index:1}.sc>.fx{position:absolute;z-index:0}
.cat{align-self:flex-start;font-weight:900;font-size:17px;color:var(--p)}.cat small{font-size:10px;color:#aaa;margin-right:6px;letter-spacing:1px;direction:ltr;display:inline-block}
.ttl{font-size:34px;font-weight:900;text-align:center;margin-top:8px;line-height:1.2;min-height:40px}
.ds{color:#e0e0e0;font-size:14.5px;text-align:center;min-height:40px;max-width:320px;margin-top:4px}
.sw{animation:pop .55s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.8)}}
.big{position:relative;width:min(66vw,280px);aspect-ratio:1;margin:18px auto 6px;opacity:0;scale:.5;transition:1s cubic-bezier(.2,1.3,.4,1);transform:translateY(calc(var(--p,0)*50px)) rotate(calc(var(--p,0)*28deg))}
.in .big{opacity:1;scale:1}
.big:before{content:"";position:absolute;inset:-14px;border:2px dashed var(--p);border-radius:50%;opacity:.6;animation:sp 28s linear infinite}@keyframes sp{to{rotate:360deg}}
.bi{position:absolute;inset:0;border-radius:50%;background:var(--im) 30% 30%/190%;border:6px solid #1c1c1c;box-shadow:0 22px 50px #000,0 0 0 2px var(--p),0 0 45px color-mix(in srgb,var(--p) 45%,transparent);display:grid;place-items:center;font-size:125px;overflow:hidden}
.bi.e{background:radial-gradient(circle,#4a3418,#161616)}
.chip{position:absolute;left:-18px;top:10%;background:#fff;color:#111;border-radius:14px;padding:6px 11px;z-index:3;box-shadow:0 8px 20px #0009;animation:bob 3s ease-in-out infinite;line-height:1.1}
.chip small{display:block;font-size:10px;color:#d11}.chip b{font-size:21px;font-weight:900}
.dc{position:absolute;font-size:34px;z-index:3;animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(0 6px 8px #000)}
.roo{position:absolute;width:72px;right:0;top:-17%;z-index:4;transform-origin:50% 100%;rotate:calc(var(--p,0)*-28deg);animation:pk 2.4s ease-in-out infinite;cursor:pointer;filter:drop-shadow(0 6px 8px #000)}
@keyframes pk{0%,55%,100%{transform:none}65%{transform:rotate(16deg) translateY(3px)}72%{transform:rotate(-3deg)}80%{transform:rotate(14deg) translateY(3px)}90%{transform:none}}
.roo.cr{animation:cr .8s}@keyframes cr{20%{transform:scale(1.3) rotate(-12deg)}40%{transform:scale(1.3) rotate(12deg)}60%{transform:scale(1.3) rotate(-12deg)}}
.rw{position:relative;display:flex;align-items:center;width:calc(100% + 16px);margin:auto -8px 0}.tabs+.rw{margin-top:0}.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:auto;padding:8px 0 0}.tabs button{border:0;border-radius:22px;padding:8px 15px;font:700 15px Cairo,Tahoma,sans-serif;background:#ffffff22;color:#fff}.tabs button.on{background:linear-gradient(135deg,var(--o),var(--y));color:#111}
.row{flex:1;min-width:0;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:52px 16px 14px;scrollbar-width:none}
.cd{flex:none;width:128px;scroll-snap-align:center;position:relative;border-radius:24px;background:linear-gradient(#2c2c2c,#141414);padding:50px 8px 10px;text-align:center;cursor:pointer;transition:.3s;opacity:0;translate:0 30px}
.in .cd{opacity:1;translate:0}.cd.on{transform:translateY(-8px);box-shadow:0 12px 26px color-mix(in srgb,var(--p) 40%,transparent)}
.cd .im{position:absolute;top:-40px;left:50%;margin-left:-42px;width:84px;height:84px;border-radius:50%;background:var(--im) var(--ps)/270%;display:grid;place-items:center;font-size:42px;background-color:#2a1d0c;box-shadow:0 8px 14px #000a}
.cd b{display:block;font-size:14.5px;line-height:1.3;min-height:38px}.cd small{display:block;font-size:11px;color:#aaa;min-height:15px}.cd .pc{color:var(--p);font-weight:900;font-size:17px;margin-top:4px}
.ar{position:absolute;top:60%;z-index:3;flex:none;width:40px;height:40px;border:0;border-radius:50%;background:#333;color:#fff;font-size:24px;line-height:1}.ar{right:8px;background:#000b}.ar+.row+.ar{right:auto;left:8px;background:var(--o)}
.hint{margin-top:10px;color:var(--y);font-size:13px;animation:bob 1.6s infinite;position:relative}
.hero .lw{position:relative;display:inline-block}.hero .roo{width:84px;right:-40px;top:-30px;rotate:none}
</style></head><body>
